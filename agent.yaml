spec_version: "0.1.0"
name: "antimicrobial-resistance-gene-profiler"
version: "1.0.0"
category: "healthcare"
author: "Rucha Salpure"
description: "Assembles bacterial whole-genome next-generation sequencing reads to identify plasmid-borne beta-lactamase and carbapenemase resistance alleles"
capabilities:
  - "card-ontology-amr-annotation"
  - "autonomous-decision-making"
  - "explainable-auditing"
  - "multi-agent-collaboration"
skills:
  - "card-ontology-amr-annotation"
tools:
  - "python_executor"
  - "audit_logger"
  - "schema_validator"
runtime:
  environment: "python3.11"
  memory_limit: "4GB"
  timeout_seconds: 300
governance:
  audit_logging: true
  human_in_the_loop: false
  maker_checker: true
  explainability_required: true
